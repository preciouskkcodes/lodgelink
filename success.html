<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LodgeLink — Payment Successful</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: #FDF6EC;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: white;
      border-radius: 22px;
      padding: 40px 28px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 6px 24px rgba(11,31,58,0.13);
    }
    .icon { font-size: 56px; margin-bottom: 16px; }
    .title {
      font-family: 'Syne', sans-serif;
      font-size: 24px;
      font-weight: 800;
      color: #0B1F3A;
      margin-bottom: 8px;
    }
    .sub { font-size: 14px; color: #7A95B0; margin-bottom: 24px; line-height: 1.6; }
    .detail-box {
      background: #EEF4FB;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      text-align: left;
    }
    .detail-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #3D5A80;
      margin-bottom: 8px;
    }
    .detail-row:last-child { margin-bottom: 0; }
    .detail-row strong { color: #0B1F3A; }
    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      background: #0B1F3A;
      color: white;
      border: none;
      border-radius: 14px;
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .btn-secondary {
      display: block;
      width: 100%;
      padding: 14px;
      background: none;
      color: #3D5A80;
      border: 1.5px solid #D9E6F2;
      border-radius: 14px;
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      text-decoration: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <div class="title">Payment Successful!</div>
    <p class="sub">Your room is now secured. The host has been notified and will confirm your reservation shortly.</p>

    <div class="detail-box" id="reservation-details">
      <div class="detail-row">
        <span>Reservation fee</span>
        <strong>₦1,500</strong>
      </div>
      <div class="detail-row">
        <span>Status</span>
        <strong style="color:#1A7A4A;">✓ Paid & Secured</strong>
      </div>
      <div class="detail-row" id="property-row" style="display:none;">
        <span>Property</span>
        <strong id="property-name">—</strong>
      </div>
    </div>

    <a href="index.html" class="btn">Back to LodgeLink</a>
    <a href="host.html" class="btn-secondary">Are you a host? List your property</a>
  </div>

  <script>
    // Read pending reservation from localStorage and save to Supabase
    const SUPABASE_URL = 'https://zomcrvfekwihqrrqvifi.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_lC9xUJnLXMF5saz5Y6JYag_JGzmP6fD';

    async function completeReservation() {
      const raw = localStorage.getItem('lodgelink_pending_reservation');
      if (!raw) return;

      try {
        const record = JSON.parse(raw);
        record.status = 'paid';

        // Show property name
        if (record.propertyName) {
          document.getElementById('property-row').style.display = 'flex';
          document.getElementById('property-name').textContent = record.propertyName;
        }

        // Save to Supabase
        await fetch(`${SUPABASE_URL}/rest/v1/reservations`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=representation',
          },
          body: JSON.stringify({
            listing_id:      record.listing_id,
            guest_name:      record.guest_name,
            guest_phone:     record.guest_phone,
            guests:          record.guests,
            nights:          record.nights,
            price_per_night: record.price_per_night,
            total_cost:      record.total_cost,
            reservation_fee: 1500,
            program:         record.program || 'unspecified',
            status:          'paid',
          }),
        });

        // Clear pending reservation
        localStorage.removeItem('lodgelink_pending_reservation');

      } catch (err) {
        console.error('Could not save reservation:', err);
      }
    }

    document.addEventListener('DOMContentLoaded', completeReservation);
  </script>
</body>
</html>
